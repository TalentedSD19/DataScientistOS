    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
