name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Create demo database
        run: uv run python scripts/create_demo_db.py

      - name: Build sandbox Docker image
        run: |
          docker build \
            -t datascientistos-sandbox:day2 \
            -f sandbox/Dockerfile \
            .

      - name: Verify sandbox image
        run: |
          docker run --rm \
            datascientistos-sandbox:day2 \
            python -c "print(2 + 3)"

      - name: Run tests
        run: uv run pytest -q

      - name: Run evaluator smoke test
        run: uv run python -m evaluation.runner --sample 0
