name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Create demo database
        run: uv run python scripts/create_demo_db.py

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  sandbox-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Build sandbox image
        run: docker build -t datascientistos-sandbox:day2 -f sandbox/Dockerfile .

      - name: Run sandbox safety tests
        run: uv run pytest tests/sandbox -q
